[package]
name = "zerok-rs"
version = "0.1.1"
edition = "2021"
description = "Zerok Vault - Zero-knowledge encrypted storage in Rust"
authors = ["Zerok Team"]
license = "MIT"

[dependencies]
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
rusoto_s3 = "0.48"
thiserror = "1.0"
chrono = "0.4"
hex = "0.4"

[lib]
name = "zerok"
path = "src/lib.rs"

[[bin]]
name = "zerok"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true